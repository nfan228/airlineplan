name: 外站票雷達

on:
  schedule:
    - cron: "0 1 * * *"      # 每天 UTC 01:00 ＝ 台灣時間 09:00
  workflow_dispatch:          # 也可以手動按按鈕執行

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 掃描並通知
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python flight_radar.py

      - name: 保存價格歷史
        run: |
          git config user.name "flight-radar"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/prices.db reports/latest.md
          git diff --staged --quiet || git commit -m "掃描 $(date -u +%Y-%m-%d)"
          git push
