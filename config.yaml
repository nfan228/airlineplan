# ===== 外站票雷達 設定檔 v2 =====
# 目標：香港 → 台北（中停）→ 歐美 → 台北（中停）→ 香港 的四腿票
# 修改後直接存檔即可，不需要改程式

currency: twd
home: TPE                # 你住的地方＝中停點
months_ahead: 6          # 掃描未來幾個月

trip_days:               # 歐美段去回程間隔幾天
  min: 7
  max: 30

# 外站＝票的起訖點。程式會分別試算從哪個外站開票最划算
outstations:
  HKG: 香港
  BKK: 曼谷
  ICN: 首爾

# 可以中停台北的航空。必須同時經營「外站⇄台北」和「台北⇄目的地」才組得出四腿票
stopover_carriers:
  BR: 長榮
  CI: 華航
  JX: 星宇

# 台北中停幾天（第一段落地台北後待幾天才飛歐美；回到台北後待幾天才飛回外站）
stopover:
  days_before: 2
  days_after: 2

# 目的地。程式會自動確認「台北有沒有直飛」，沒直飛的會自動略過，
# 所以這裡可以放寬一點，不用自己維護航線表
destinations:
  歐洲:
    VIE: 維也納
    AMS: 阿姆斯特丹
    FRA: 法蘭克福
    MUC: 慕尼黑
    CDG: 巴黎
    LHR: 倫敦
    FCO: 羅馬
    MXP: 米蘭
    PRG: 布拉格
    IST: 伊斯坦堡
  北美:
    LAX: 洛杉磯
    SFO: 舊金山
    SEA: 西雅圖
    ONT: 安大略
    JFK: 紐約
    EWR: 紐華克
    YVR: 溫哥華
    IAH: 休士頓
    ORD: 芝加哥
  大洋洲:
    BNE: 布里斯本
    SYD: 雪梨

# 第一階段的資料抓取方式。兩個過濾都預設關閉，原因：
#   direct_only：Travelpayouts 快取裡標記為「直飛」的筆數極少，開了資料幾乎抓不到。
#   require_taiwan_carrier：它每組日期只回傳最便宜的那一家，台北飛歐美最便宜的
#     幾乎都是外籍轉機票，開了會把 20 個目的地的資料全部濾掉。
# 航空公司的限制放在第二階段用 Google Flights 執行，那裡才過濾得準。
direct_only: false
require_taiwan_carrier: false

deal_threshold_pct: 12   # 台北來回票比常見價便宜多少 % 才列為候選
baseline_window_days: 60
min_samples: 20
# 沒有任何一筆達到上面的門檻時，改用「單純最便宜的那幾筆」當候選，
# 這樣第二階段才有東西可查。剛開始沒有歷史資料時特別重要。
fallback_to_cheapest: true
max_deals_in_report: 12
request_delay_sec: 0.7

# 外站來回票實際報價（Google Flights，需要 SERPAPI_KEY）
multicity:
  enabled: true
  # 每個目的地要用掉「1 次對照組 ＋ 每個外站各 1 次」＝ 目前是 4 次。
  # SerpApi 免費額度每月 250 次，所以 4（＝每天 1 個目的地、每月 120 次）最安全，
  # 想每天看 2 個目的地就設 8，但每月會用到 240 次，幾乎貼著上限。
  max_per_run: 4
  # 要不要額外查「拆成四段單程」的價格當參考。
  # Google 會分段計價再加總，通常比一張外站來回票貴一倍以上，而且每查一次就多吃一次額度。
  # 想親眼確認「不能拆開買」才打開它。
  four_leg_check: false
